include:
  - project: opentibia-740/infra/ci-templates
    ref: main
    file:
      - /templates/defaults.yml
      - /jobs/workspace.yml
      - /jobs/dotnet.yml

variables:
  OT740_REPO_ROLE: maps
  OT740_DOTNET_BUILD_PROJECT: tools/map-editor/Ot74.Map.Cli/Ot74.Map.Cli.csproj
  OT740_DOTNET_TEST_PROJECT: tools/map-editor/tests/Ot74.Map.Tests/Ot74.Map.Tests.csproj
  OT740_DOTNET_TEST_FILTER: "FullyQualifiedName~QuestBake|FullyQualifiedName~Otbm|FullyQualifiedName~MapGenerator|FullyQualifiedName~DecompileSource"

dotnet-test-map-contracts:
  extends:
    - .ot740_workspace_before_script
    - .ot740_dotnet_test
