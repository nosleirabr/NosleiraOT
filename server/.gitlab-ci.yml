include:
  - project: opentibia-740/infra/ci-templates
    ref: main
    file:
      - /templates/defaults.yml
      - /jobs/workspace.yml
      - /jobs/dotnet.yml

variables:
  OT740_REPO_ROLE: server
  OT740_DOTNET_BUILD_PROJECT: server/tests/Ot74.Gameplay.Tests/Ot74.Gameplay.Tests.csproj
  OT740_DOTNET_TEST_PROJECT: server/tests/Ot74.Gameplay.Tests/Ot74.Gameplay.Tests.csproj

dotnet-build:
  extends:
    - .ot740_workspace_before_script
    - .ot740_dotnet_build

dotnet-test-l1-l3:
  extends:
    - .ot740_workspace_before_script
    - .ot740_dotnet_test
  needs:
    - dotnet-build
