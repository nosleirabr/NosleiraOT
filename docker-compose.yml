services:
  database_server:
    image: mariadb:10.11
    command: ["--skip-name-resolve", "--innodb-buffer-pool-size=256M", "--innodb-flush-log-at-trx-commit=2"]
    container_name: database_server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ot74}
      MYSQL_USER: ${MYSQL_USER:-ot74}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
    ports:
      - "${MYSQL_PUBLISH_ADDR:-127.0.0.1}:${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ot-network

  server_executable:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: server_executable:latest
    container_name: server_executable
    restart: unless-stopped
    depends_on:
      database_server:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-database_server}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-ot74}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ot74}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
    ports:
      - "${LOGIN_PORT:-7171}:7171"
      - "${GAME_PORT:-7172}:7172"
    volumes:
      - ./server:/srv
      - ./maps/build/world.otbm:/srv/data/world/world.otbm:ro
      - ./maps/build/world-spawn.xml:/srv/data/world/world-spawn.xml:ro
      - ./maps/build/world-house.xml:/srv/data/world/world-house.xml:ro
    working_dir: /srv
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - ot-network

  site_executable:
    build:
      context: ./site
      dockerfile: Dockerfile
    image: site_executable:latest
    container_name: site_executable
    restart: unless-stopped
    depends_on:
      database_server:
        condition: service_healthy
    ports:
      - "${SITE_PUBLISH_ADDR:-0.0.0.0}:${SITE_PORT:-8080}:80"
    volumes:
      - ./site:/var/www/html
      - ./server:/srv:ro
    environment:
      MYSQL_HOST: database_server
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ot74}
      MYSQL_USER: ${MYSQL_USER:-ot74}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ot-network

networks:
  ot-network:
    driver: bridge

volumes:
  mysql_data:
