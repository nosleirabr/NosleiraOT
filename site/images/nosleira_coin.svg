<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="20" height="20" style="vertical-align: middle; display: inline-block;">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5c0" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Sombra e Borda Externa -->
  <circle cx="32" cy="32" r="30" fill="url(#edgeGrad)" filter="url(#shadow)"/>
  <!-- Corpo da Moeda Dourada -->
  <circle cx="32" cy="32" r="26" fill="url(#coinGrad)" stroke="#92400e" stroke-width="2"/>
  <!-- Anel Interno -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#fffbeb" stroke-width="1.5" opacity="0.85"/>
  <!-- Letra N Dourada em Alto Relevo -->
  <text x="32" y="42" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" style="filter: drop-shadow(0px 2px 1px rgba(120,53,15,0.9));">N</text>
</svg>
