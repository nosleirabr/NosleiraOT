<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="160" height="40">
  <rect width="200" height="50" rx="4" fill="#0d1b2a"/>
  <!-- MasterCard -->
  <g transform="translate(10, 10)">
    <circle cx="12" cy="15" r="11" fill="#eb001b"/>
    <circle cx="24" cy="15" r="11" fill="#f79e1b" fill-opacity="0.85"/>
  </g>
  <!-- VISA -->
  <g transform="translate(55, 13)">
    <text x="0" y="20" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#1a1f71">VISA</text>
  </g>
  <!-- AMEX -->
  <g transform="translate(120, 12)">
    <rect width="70" height="26" rx="3" fill="#006fcf"/>
    <text x="35" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">AMEX</text>
  </g>
</svg>
