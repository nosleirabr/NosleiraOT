name: Publish Docker Images

on:
  push:
    branches: [ "main" ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  OWNER: nosleirabr

jobs:
  publish-server:
    name: TFS Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extrair metadata (tags e labels) — TFS
      id: meta-server
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nosleiraot-server
        tags: |
          type=raw,value=latest
          type=sha,prefix=sha-

    - name: Build e Push — TFS Server
      uses: docker/build-push-action@v5
      with:
        context: ./server
        file: ./server/Dockerfile
        push: true
        tags: ${{ steps.meta-server.outputs.tags }}
        labels: ${{ steps.meta-server.outputs.labels }}

  publish-site:
    name: MyAAC Site Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extrair metadata (tags e labels) — Site
      id: meta-site
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nosleiraot-site
        tags: |
          type=raw,value=latest
          type=sha,prefix=sha-

    - name: Build e Push — MyAAC Site
      uses: docker/build-push-action@v5
      with:
        context: ./site
        file: ./site/Dockerfile
        push: true
        tags: ${{ steps.meta-site.outputs.tags }}
        labels: ${{ steps.meta-site.outputs.labels }}
