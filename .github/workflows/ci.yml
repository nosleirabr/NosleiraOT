name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: L1, L2, L3 Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

- name: Prepare Config
      run: cp server/config.lua.dist server/config.lua

    - name: Build Map from Source
      run: dotnet run --project tools/map-editor/Ot74.Map.CLI -- build --from-source

    - name: Run Map Toolchain Tests (L2)
      run: dotnet test tools/map-editor/tests/Ot74.Map.Tests/Ot74.Map.Tests.csproj

    - name: Run Gameplay Tests (L1 & L3)
      run: dotnet test server/tests/Ot74.Gameplay.Tests/Ot74.Gameplay.Tests.csproj

